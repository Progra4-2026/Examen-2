spring.application.name=examen2-respuesta
spring.config.import=optional:file:.env[.properties]

# --- Servidor ---
server.port=8080

# --- Conexión a MySQL (base "minas") ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/minas?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=America/Costa_Rica
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true